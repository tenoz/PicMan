
[package]
name = "picman"
version = "1.3.0"
description = "PicMan Desktop App"
authors = ["PicMan Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "process-exit", "window-all", "dialog-all", "fs-all", "path-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# PNG 无损重压（MIT）。canvas 导出的 PNG 不做 filter 策略搜索，oxipng 通常还能再小 10–30%
oxipng = { version = "10", default-features = false, features = ["parallel"] }
# JPEG 编码（BSD-3，纯 Rust 移植的 mozjpeg，免 cmake/nasm）。同画质比 canvas 编码器小 15–25%
mozjpeg-rs = "0.9"
# 解码 canvas 交过来的 PNG 中间文件
png = "0.18"
# 直读原图时的解码（jpeg/png/webp/gif/bmp）。只开需要的格式，避免拖进一堆无关 codec
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
